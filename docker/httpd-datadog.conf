# Service, env, and version come from DD_SERVICE, DD_ENV, DD_VERSION in the container environment.
<IfFile modules/mod_datadog.so>
    LoadModule datadog_module modules/mod_datadog.so
</IfFile>

<IfModule datadog_module>
    DatadogAddTag team analysis-tools
    DatadogAddTag project msigportal

    <If "%{HTTP_USER_AGENT} =~ /^ELB-HealthChecker/">
        DatadogTracing Off
    </If>
</IfModule>
