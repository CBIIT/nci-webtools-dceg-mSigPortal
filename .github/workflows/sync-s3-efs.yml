name: Sync S3 to EFS
permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Sync environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod

jobs:
  sync-s3-efs:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    env:
      APP: msigportal
      TZ: America/New_York
      AWS_REGION: us-east-1
      TASK_DEFINITION_TEMPLATE_PATH: .github/aws
      TIER: ${{ inputs.tier }}
      CICD_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/power-user-github-actions-cicd

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.CICD_ROLE_ARN }}
          role-session-name: ${{ env.TIER }}-msigportal-efs-sync-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set dynamic environment variables
        run: |
          echo "SYNC_TASK=${TIER}-${APP}-sync" >> $GITHUB_ENV
          echo "ENVIRONMENT_TIER=${TIER^^}" >> $GITHUB_ENV

      - name: Retrieve SSM parameters
        run: |
          PARAMETER_PATH="/analysistools/${TIER}/${APP}"

          # Define parameters to retrieve (SSM name = ENV_VAR_NAME)
          declare -A PARAMS=(
            ["role_arn"]="ROLE_ARN"
            ["ecs_cluster"]="ECS_CLUSTER"
            ["subnet_ids"]="SUBNET_IDS"
            ["security_group_ids"]="SECURITY_GROUP_IDS"
            ["data_bucket"]="DATA_BUCKET"
            ["data_bucket_prefix"]="DATA_BUCKET_PREFIX"
            ["efs_filesystem_id"]="EFS_FILESYSTEM_ID"
            ["efs_access_point_id"]="EFS_ACCESS_POINT_ID"
          )

          # Retrieve each parameter and export to environment
          for ssm_name in "${!PARAMS[@]}"; do
            env_var="${PARAMS[$ssm_name]}"
            value=$(aws ssm get-parameter \
              --name "${PARAMETER_PATH}/${ssm_name}" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text)
            echo "${env_var}=${value}" >> $GITHUB_ENV
            echo "Retrieved ${ssm_name} -> ${env_var}"
          done

      - name: Resolve S3 source URI
        run: |
          PREFIX="${DATA_BUCKET_PREFIX:-msigportal/Database/}"
          # Ensure prefix has a trailing slash for S3 URI construction
          PREFIX="${PREFIX%/}/"
          echo "DATA_S3_URI=s3://${DATA_BUCKET}/${PREFIX}" >> $GITHUB_ENV
          echo "Sync source: s3://${DATA_BUCKET}/${PREFIX} -> /data/Database/"

      - name: Create rendered task definitions directory
        run: mkdir -p rendered

      - name: Substitute sync task definition variables
        run: |
          envsubst < $TASK_DEFINITION_TEMPLATE_PATH/sync.yml > rendered/sync.yml
          echo "Rendered sync task definition:"
          cat rendered/sync.yml

      - name: Register sync task definition
        run: aws ecs register-task-definition --cli-input-yaml file://rendered/sync.yml

      - name: Run sync task
        id: run-task
        run: |
          NETWORK_CONFIG=$(jq -n \
            --arg subnets "$SUBNET_IDS" \
            --arg sgs "$SECURITY_GROUP_IDS" \
            '{
              awsvpcConfiguration: {
                subnets: ($subnets | split(",") | map(gsub("^\\s+|\\s+$";""))),
                securityGroups: ($sgs | split(",") | map(gsub("^\\s+|\\s+$";""))),
                assignPublicIp: "DISABLED"
              }
            }')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$SYNC_TASK" \
            --network-configuration "$NETWORK_CONFIG" \
            --query 'tasks[0].taskArn' \
            --output text)

          if [[ -z "$TASK_ARN" || "$TASK_ARN" == "None" ]]; then
            echo "::error::run-task did not return a task ARN"
            exit 1
          fi

          echo "Started task: $TASK_ARN"
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "TASK_ARN=$TASK_ARN" >> $GITHUB_ENV

      - name: Wait for sync task to complete
        run: |
          echo "Waiting for task to stop: $TASK_ARN"
          # `aws ecs wait tasks-stopped` is hard-capped at 100 polls x 6s = 10 min and
          # cannot be extended via the CLI, so large syncs (qa/prod) falsely report a
          # failed job when the task legitimately runs longer. Poll instead, bounded by
          # this job's timeout-minutes, and judge success only by the container exit code.
          MISSING=0
          while true; do
            STATUS=$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' \
              --output text)
            echo "$(date -u +%H:%M:%S) task status: $STATUS"
            # A missing task yields empty/None; tolerate a brief eventual-consistency
            # window, then fail fast (with diagnostics) rather than spinning to timeout.
            if [[ -z "$STATUS" || "$STATUS" == "None" ]]; then
              MISSING=$((MISSING + 1))
              if (( MISSING >= 3 )); then
                echo "::error::describe-tasks returned no task for $TASK_ARN after $MISSING attempts — cannot determine sync status"
                aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --output json || true
                exit 1
              fi
              sleep 15
              continue
            fi
            MISSING=0
            [[ "$STATUS" == "STOPPED" ]] && break
            sleep 15
          done

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`sync`].exitCode | [0]' \
            --output text)

          STOP_REASON=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' \
            --output text)

          echo "Stopped reason: $STOP_REASON"
          echo "Container exit code: $EXIT_CODE"

          if [[ "$EXIT_CODE" != "0" ]]; then
            echo "::error::sync task did not exit cleanly (exit code: $EXIT_CODE) — check CloudWatch group /analysistools/$TIER/$APP/sync"
            exit 1
          fi

          echo "EFS data sync completed successfully."
